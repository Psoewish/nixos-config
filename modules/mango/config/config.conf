# Imports
source=~/.config/mango/noctalia.conf
source=~/.config/mango/keybinds.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/autostart.conf

# Misc
drag_corner=4
focus_cross_monitor=1
border_px=1
border_radius=0
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=5
gap_outer_vertical=5

cursor_size=24
cursor_theme="Bibata-Modern-Ice"

# Master
new_is_master=0
default_master_factor=0.5
default_master_count=1

# Scroller
scroller_structs=5
scroller_default_proportion=0.5
scroller_proportion_preset=0.666,0.5,0.333
scroller_prefer_overspread=0
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=0

# Animations
animations=1

# Blur
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
layer_animations=0

# Shadows
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadows_color=0x000000ff
