# Monitor rules
monitor_rule=name:DP-1,x:0,y:1440,scale:1,primary:1
monitor_rule=name:DP-2,x:0,y:0,scale:1

# Tag rules
tag_num=4
tag_rule=id:*,monitor_name:DP-1,layout_name:fair
tag_rule=id:*,monitor_name:DP-2,layout_name:scroller

# Window rules
window_rule=app_id:^(discord|com.github.th-ch.youtube-music)$,monitor:DP-2,tags:1
window_rule=app_id:^(steam_app_\d+)$,monitor:DP-1,tags:2

# Scratchpads
scratchpad_width_ratio=0.5
scratchpad_height_ratio=0.5

window_rule=is_named_scratchpad:1,app_id:foot-scratch
bind=SUPER+SHIFT,return,toggle_named_scratchpad,foot-scratch,none,foot --app-id foot-scratch

window_rule=is_named_scratchpad:1,app_id:btop-scratch
bind=SUPER+SHIFT,ESCAPE,toggle_named_scratchpad,btop-scratch,none,foot --app-id btop-scratch btop

