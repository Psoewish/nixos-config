# Monitor rules
monitor_rule=name:DP-1,x:0,y:1440,scale:1,primary:1
monitor_rule=name:DP-2,x:0,y:0,scale:1

# Tag rules
tag_num=4
tag_rule=id:*,monitor_name:DP-1,layout_name:fair
tag_rule=id:*,monitor_name:DP-2,layout_name:scroller

# Window rules
window_rule=app_id:^(discord|com.github.th-ch.youtube-music)$,monitor:DP-2,tags:1
window_rule=app_id:^(steam_app_\d+)$,monitor:DP-1,tags:4
