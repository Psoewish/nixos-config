# Launch applications
bind=SUPER,B,spawn,helium
bind=SUPER,RETURN,spawn,foot
# bind=SUPER,E,spawn,nautilus
bind=SUPER,SLASH,spawn,noctalia msg panel-toggle launcher

# Screenshots
bind=none,PRINT,spawn,noctalia msg screenshot-region
bind=ALT,PRINT,spawn,noctalia msg screenshot-window
bind=SHIFT,PRINT,spawn,noctalia msg screenshot-fullscreen pick

# Reload config
bind=SUPER+SHIFT,R,reload_config

# Overview
bind=SUPER,TAB,overcircle,next
bind=SUPER+SHIFT,TAB,overcircle,prev

# Client actions
bind=SUPER,Q,killclient
bind=SUPER,G,togglefloating
bind=SUPER,F,togglemaximizescreen
bind=SUPER+SHIFT,F,togglefullscreen

# Resize clients
# bind=SUPER,R,switch_proportion_preset
bind=SUPER,R,set_proportion,0.333
bind=SUPER,S,set_proportion,0.5
bind=SUPER,T,set_proportion,0.666

# Focus clients
bind=SUPER,LEFT,focusdir,left
bind=SUPER,N,focusdir,left
bind=SUPER,DOWN,focusdir,down
bind=SUPER,E,focusdir,down
bind=SUPER,UP,focusdir,up
bind=SUPER,I,focusdir,up
bind=SUPER,RIGHT,focusdir,right
bind=SUPER,O,focusdir,right

# Move clients
bind=SUPER+SHIFT,LEFT,exchange_client,left
bind=SUPER+SHIFT,N,exchange_client,left
bind=SUPER+SHIFT,DOWN,exchange_client,down
bind=SUPER+SHIFT,E,exchange_client,down
bind=SUPER+SHIFT,UP,exchange_client,up
bind=SUPER+SHIFT,I,exchange_client,up
bind=SUPER+SHIFT,RIGHT,exchange_client,right
bind=SUPER+SHIFT,O,exchange_client,right

bind=SUPER+CTRL,LEFT,scroller_stack,left
bind=SUPER+CTRL,N,scroller_stack,left
bind=SUPER+CTRL,RIGHT,scroller_stack,right
bind=SUPER+CTRL,O,scroller_stack,right

# Focus tag
bind=SUPER,1,viewcrossmon,1,DP-1
bind=SUPER,2,viewcrossmon,2,DP-1
bind=SUPER,3,viewcrossmon,3,DP-1
bind=SUPER,4,viewcrossmon,4,DP-1
bind=SUPER,5,viewcrossmon,1,DP-2

# Move client to tag
bind=SUPER+SHIFT,1,tagcrossmon,1,DP-1
bind=SUPER+SHIFT,2,tagcrossmon,2,DP-1
bind=SUPER+SHIFT,3,tagcrossmon,3,DP-1
bind=SUPER+SHIFT,4,tagcrossmon,4,DP-1
bind=SUPER+SHIFT,5,tagcrossmon,1,DP-2

# Toggle tag view
bind=SUPER+CTRL,1,toggleview,1,0
bind=SUPER+CTRL,2,toggleview,2,0
bind=SUPER+CTRL,3,toggleview,3,0
bind=SUPER+CTRL,4,toggleview,4,0

# Mouse binds
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
